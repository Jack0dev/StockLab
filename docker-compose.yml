# StockLab — Docker Compose (Local Development)
# Dùng cho ML pipeline và admin tools.
# Spring Boot backend vẫn chạy qua Laragon/IDE như cũ.
#
# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose logs -f mysql


services:
  # ===== MySQL 8.0 =====
  # Phục vụ cả Spring Boot backend và ML service.
  # Giữ port 3307 để tránh conflict với Laragon MySQL (3306).
  mysql:
    image: mysql:8.0
    container_name: stocklab-mysql
    restart: unless-stopped
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-stocklab2026}
      MYSQL_DATABASE: ${DB_NAME:-stock_lap}
      MYSQL_USER: ${DB_USER:-stocklab}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stocklab2026}
    volumes:
      - stocklab_mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-stocklab2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis 7 =====
  redis:
    image: redis:7-alpine
    container_name: stocklab-redis
    restart: unless-stopped
    ports:
      - "${DOCKER_REDIS_PORT:-6380}:6379"
    volumes:
      - stocklab_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== phpMyAdmin =====
  # Truy cập: http://localhost:8081
  # Login: root / ${DB_PASSWORD}
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: stocklab-phpmyadmin
    restart: unless-stopped
    ports:
      - "${DOCKER_PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-stocklab2026}
    depends_on:
      mysql:
        condition: service_healthy

  # ===== Redis Commander =====
  # Truy cập: http://localhost:8082
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: stocklab-redis-commander
    restart: unless-stopped
    ports:
      - "${DOCKER_REDIS_CMD_PORT:-8082}:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  stocklab_mysql_data:
    driver: local
  stocklab_redis_data:
    driver: local
