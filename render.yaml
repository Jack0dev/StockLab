# render.yaml — StockLab Infrastructure as Code
# Place this file in the repository root
# Docs: https://docs.render.com/blueprint-spec

services:
  # ===== Backend: Spring Boot (Docker) =====
  - type: web
    plan: free
    name: stocklab-backend
    runtime: docker
    rootDir: stocklab-backend
    dockerfilePath: ./Dockerfile
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # MySQL (TiDB Cloud / Aiven)
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      # Redis (Upstash)
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      # App config
      - key: SPRING_PROFILE
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SHOW_SQL
        value: "false"
      # Gemini AI
      - key: GEMINI_API_KEY
        sync: false
      # VNPay
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false

  # ===== Frontend: React Static Site (Free, Unlimited) =====
  - type: web
    plan: static
    name: stocklab-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: stocklab-frontend
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
