<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Rounded Squircle Background -->
  <rect width="32" height="32" rx="8" fill="#090d16" />
  
  <!-- Gamepad-2 + Candlestick-Chart Fusion -->
  <g transform="translate(4, 4)" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Gamepad Body -->
    <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" />
    
    <!-- Left D-pad -->
    <line x1="5.5" y1="11" x2="8.5" y2="11" />
    <line x1="7" y1="9.5" x2="7" y2="12.5" />
    
    <!-- Right Action Buttons -->
    <circle cx="16.5" cy="11.5" r="0.8" fill="#ffffff" />
    <circle cx="18.5" cy="9.5" r="0.8" fill="#ffffff" />
    
    <!-- Center Candlesticks (Emerald Bullish Glow) -->
    <line x1="10.5" y1="7" x2="10.5" y2="8.5" stroke="#10b981" stroke-width="1.6" />
    <rect x="9.5" y="8.5" width="2" height="3" rx="0.4" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="1.4" />
    <line x1="10.5" y1="11.5" x2="10.5" y2="13" stroke="#10b981" stroke-width="1.6" />
    
    <line x1="13.5" y1="6" x2="13.5" y2="7.5" stroke="#10b981" stroke-width="1.6" />
    <rect x="12.5" y="7.5" width="2" height="4.5" rx="0.4" fill="#10b981" stroke="#10b981" stroke-width="1.4" />
    <line x1="13.5" y1="12" x2="13.5" y2="13.5" stroke="#10b981" stroke-width="1.6" />
  </g>
</svg>
